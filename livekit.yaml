# =============================================================================
# LiveKit Server Configuration
# =============================================================================

port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  # THE address every participant's browser is told to send media to. GIN
  # enabled INTERNET -> 213.42.53.198 -> 10.228.145.5 (TCP 7881 / UDP 7882,
  # CRC0005629) on 2026-08-18, so this now carries the dedicated public IP.
  #
  # Set HERE, in the file, because nothing else wins: this livekit build takes
  # the config-file value over both the NODE_IP env var and the --node-ip CLI
  # flag — both were tried on 2026-08-18 and the server kept advertising the
  # yaml value. The old comment promised an env-var switch; that mechanism was
  # never real for a docker-run container.
  #
  # KNOWN CONSTRAINT (verified 2026-08-18): the NAT does NOT hairpin — from
  # inside the datacenter 213.42.53.198 is unreachable (tested from APPQA and
  # the dev box; TCP to 7881 times out). External browsers reach this address;
  # datacenter-internal clients (the transcription agent, dev-box tests) cannot,
  # and now depend on ICE peer-reflexive discovery of the server's real address.
  # If the agent stops transcribing after this change, that is where to look.
  node_ip: 213.42.53.198
  # Stays false deliberately. `true` auto-detects the external address over STUN,
  # which is the wrong answer behind this NAT — it would discover the shared
  # egress address, not the dedicated inbound one Moro is allocating.
  use_external_ip: false

# Keys are injected via LIVEKIT_KEYS env var in docker-compose.livekit.yml
# Do NOT hardcode secrets here. Set LIVEKIT_API_KEY and LIVEKIT_API_SECRET in .env
keys: {}

room:
  auto_create: true
  empty_timeout: 300        # 5 min after last participant leaves
  max_participants: 10

# Webhooks are DISABLED — see below before re-enabling.
#
# This block crash-looped the staging LiveKit server 2,379 times.
#
# The old comment here claimed "api_key is resolved from LIVEKIT_KEYS env var at
# runtime". That is not true: LiveKit does NOT derive webhook.api_key from
# LIVEKIT_KEYS. It requires an explicit key name that exists in the keys map.
# With an empty string the server logs "api_key is required to use webhooks"
# and EXITS 0 on startup — a clean exit, so under `restart: unless-stopped` it
# just restarts silently every ~60s and never serves. Video interviews are down
# the whole time with no crash and no error state to alert on.
#
# The urls target (egress-webhook:8003) is also not deployed, so this block had
# no working consumer in any environment we run today.
#
# To re-enable: deploy the egress-webhook service AND set api_key to a key that
# exists in LIVEKIT_KEYS (currently "devkey"; the backend uses the matching
# LIVEKIT_API_KEY=devkey).
#
# webhook:
#   urls:
#     - "http://egress-webhook:8003/webhook/egress"
#   api_key: devkey

logging:
  level: info
  pion_level: warn

# TURN is how a DATACENTER-INTERNAL browser gets media at all.
#
# THE PROBLEM IT SOLVES (measured 2026-08-31)
#
# rtc.node_ip above is the public address, and the NAT does not hairpin, so the
# only media candidates the server offers are unreachable from inside:
#
#   publisherCandidates: ["udp4 host 213.42.53.198:7882",
#                         "tcp4 host 213.42.53.198:7881",
#                         "[remote][filtered] udp host :51093"]
#   Failed to ping without candidate pairs. Connection is not possible yet.
#
# A recruiter's browser joined the room, sat there for fifteen seconds, then
# died with "could not establish pc connection". Signalling was never the
# problem; there was simply no address both ends could reach.
#
# ONE node_ip CANNOT BE BOTH ADDRESSES. Internal clients can reach only
# 10.228.145.5; external clients can reach only 213.42.53.198 (verified from
# the dev box and from APPQA: TCP 7881 to either public address times out from
# inside). use_external_ip cannot help — STUN egress is blocked from this
# datacenter, so auto-discovery times out (tested against stun.l.google.com).
#
# So the public address stays on node_ip, serving external browsers exactly as
# before, and internal browsers are given a relay they CAN reach. Nothing about
# the external path changes.
turn:
  enabled: true
  udp_port: 3478
  tls_port: 0
  # The address handed to clients as the relay. The internal one: external
  # clients do not need TURN — they already have working host candidates — and
  # an unreachable extra candidate costs them only a little ICE gathering time,
  # whereas internal clients have nothing else at all.
  domain: 10.228.145.5
  # Relay allocations. LiveKit's default is 30000-40000; every port in the range
  # has to be published on the container, and Docker spawns a userland proxy per
  # port, so ten thousand of them is not deployable. Thirty concurrent relayed
  # allocations is ample against room.max_participants: 10.
  relay_range_start: 30000
  relay_range_end: 30029
